version: 2.1
orbs:
  node: circleci/node@5.0.2

executors:
  pw-noble-development:
    docker:
      - image: mcr.microsoft.com/playwright:v1.62.1-noble
jobs:
  vitestpress:
    working_directory: ~/project
    docker:
      - image: cimg/node:26.8.1
    steps:
      - checkout
      - node/install:
          node-version: "26.8.1"
      - node/install-packages
      - run:
          command: npm run docs:build
          name: Confirm that we can build the vitestpress docs
  package:
    working_directory: ~/project
    docker:
      - image: cimg/node:26.8.1
    steps:
      - checkout
      - node/install:
          node-version: "26.8.1"
      - node/install-packages
      - run:
          command: npm run build
          name: Confirm that we can build the package for NPM
  playwright:
    executor: pw-noble-development
    working_directory: ~/project
    # parallelism: 4
    steps:
      - checkout
      - node/install-packages
      - run: npx playwright test
      # - run: SHARD="$((${CIRCLE_NODE_INDEX}+1))"; npx playwright test --shard=${SHARD}/${CIRCLE_NODE_TOTAL}
workflows:
  test_my_app:
    jobs:
      - node/test:
          matrix:
            parameters:
              version:
                - 26.8.1
                - 24.2.0
                - 22.16.0
      - playwright
      - vitestpress
      - package
